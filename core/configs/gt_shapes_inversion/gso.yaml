# GT_SHAPES_INVERSION block — single-mesh GSO GT injection.
# Layout: data/gso30/{scene}/meshes/model.obj.  One inversion per
# object, broadcast across all per-frame raw_ss_modalities['shape'];
# canonical_shape_coords[obj_idx] populated for Stage-2 canonical;
# per-frame poses derived from c2w when load_gt_poses=true.

enabled: true

mode: global
gt_data_root: data/gso30
scene_subdir: ""           # per_frame_meshes only — ignored in mode=global
num_inversion_steps: 100
prior_weight: 1.0          # VAE-prior moment match: prior_weight * (mean(z)^2 + (var(z) - prior_target_var)^2)
prior_target_var: 0.9      # target variance — matches empirical Stage-1 distribution
l2_weight: 0.0             # per-element L2: redundant with prior_weight>0; leave at 0.0
inversion_precision: auto  # auto = bf16 on Ampere+, fp32 otherwise (bf16 is 1.7x SLOWER on pre-Ampere). Force: fp32 | bf16 | fp16
inversion_chunk_size: 16   # frames per GPU batch (per_frame_meshes); ~1.0 GB activations/frame, OOM halves+retries. 0 = all
gt_mesh_dilate: 0
load_gt_poses: true

# Per-block output flags (null = inherit from global output config)
save_renders: null
save_metrics: null
save_cache: null
exit_after: false
