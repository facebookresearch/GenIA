<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D viewer</title>
    <!--
      Host page for the 3DView viewer bundle (submodules/3DView, v2), embedded in the
      Gradio apps as an <iframe>: the bundle in a page of our own, with a host bridge
      (3DView's docs/embedding.md, "The bundle in your own page").

      Everything is driven by one query param, `manifest`: the URL of a JSON file
      `{sources, done, hidePoints, hideVoxelGrid, livePoses}` the Python side (viewer.py)
      rewrites as the run produces content. It is POLLED rather than baked into the URL
      because the run grows a scene: the cameras appear after preprocessing and the
      splats only at the end, and posting just the ids not posted before ADDS them to the
      live scene; reloading this page would drop the scene and the viewpoint the user set.

      `sources` are 3DView messages, posted as they are: `loadColmap` (point cloud +
      camera frustums) and `addAsset` (mesh, 3DGS splats, tracks). Everything else is
      3DView's API too: `configure`, `removeItem`, `setItemVisible`, `setTransform`.
    -->
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
      canvas { display: block; position: fixed; top: 0; left: 0; }
      /* Where the bundle writes loading progress and errors. */
      #status {
        position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
        max-width: min(560px, calc(100vw - 32px));
        display: flex; align-items: center; justify-content: center; text-align: center;
        padding: 10px 16px; color: #e6e6e6; background: rgba(20, 20, 22, 0.72);
        backdrop-filter: blur(12px) saturate(1.3);
        border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px;
        font-size: 13px; line-height: 1.5; z-index: 100; pointer-events: none;
      }
      #status code { background: rgba(255,255,255,.1); padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="status">Loading viewer…</div>
    <script>
      (function () {
        const q = new URLSearchParams(location.search);
        const status = document.getElementById("status");
        const fail = (m) => { status.style.display = "flex"; status.textContent = m; };
        const send = (msg) => window.postMessage(msg, "*");   // to the viewer, in this window

        // The panels: the Scene list always (how a visitor sees WHAT is loaded and toggles
        // it) and Capture; the display controls (helpers, appearance) only when the host
        // asks, since they duplicate decisions the pipeline already made. `?ui=0|1` is the
        // host checkbox's state at load (gv.UI_DEFAULT), `hostUi` messages its changes.
        const panels = (show) => (show ? ["scene", "display", "capture"] : ["scene", "capture"]);

        // The bridge, read by the bundle at startup. Its configuration applies before the
        // first frame: no grid / axes / box (scaffolding in a results view), no editing
        // (the Python side decides what is loaded) and no physics. Events and replies need
        // no answer here; a capture downloads in the page by itself.
        window.__viewerHost = {
          config: {
            show: { grid: false, axes: false, box: false },
            ui: { panels: panels(q.get("ui") !== "0") },
            interaction: { edit: false, physics: false },
          },
          postMessage() {},
        };
        window.addEventListener("message", (e) => {
          if (e.data && e.data.type === "hostUi") {
            send({ type: "configure", ui: { panels: panels(!!e.data.show) } });
          }
        });

        const manifest = q.get("manifest");
        if (!manifest) { fail("No `manifest` parameter — nothing to load."); return; }

        const POLL_MS = 1500;
        const POSES_MS = 500;
        // Labels set by demo/ui/viewer.py (VOXEL_GRID_LABEL, POSE_CUBES_LABEL, and the
        // label its _splat_sources gives FINAL's world splats): they MUST match.
        const VOXEL_GRID_LABEL = "voxel grid";
        const POSE_CUBES_LABEL = "pose cubes";
        const FINAL_OBJECTS_LABEL = "objects";

        const posted = new Set();
        let voxelGridId = null;   // the voxel-grid item now in the scene
        let poseCubesId = null;   // the pose-cubes item, once in the scene
        const previews = new Map();   // an object's preview-splats label -> its item now shown
        const placed = new Map();     // live-pose key (obj_i) -> that object's preview item
        let hideVoxelGrid = false;    // splats are up: each voxel grid posted from now is hidden
        let pointsHidden = false;
        let posesUrl = null;          // the run's live_poses file, once the manifest names it
        let finished = false;         // the run is done: stop following its poses

        // One pass over the manifest: post what is new, then poll again unless the run says
        // it is finished. Every failure (not written yet, a 404, a torn read) means: retry.
        async function poll() {
          try {
            const sep = manifest.includes("?") ? "&" : "?";
            const res = await fetch(manifest + sep + "t=" + Date.now(), { cache: "no-store" });
            if (res.ok) {
              const data = await res.json();
              // Once splats are up, the voxel grid (a preview of the shapes) is hidden,
              // and the depth cloud (the INPUT they were reconstructed from) too; asked
              // once each, after which the toggles belong to whoever is looking.
              if (data.hideVoxelGrid && !hideVoxelGrid) {
                hideVoxelGrid = true;
                if (voxelGridId) send({ type: "setItemVisible", id: voxelGridId, visible: false });
              }
              if (data.hidePoints && !pointsHidden) {
                pointsHidden = true;
                send({ type: "configure", show: { points: false } });
              }
              for (const msg of data.sources || []) {
                if (!msg || !msg.id || posted.has(msg.id)) continue;
                posted.add(msg.id);
                // A newer preview replaces the one before it: the voxel grid after each
                // block, an object's splats after each block, and FINAL's objects every
                // object's preview splats (the same Gaussians).
                if (msg.label === VOXEL_GRID_LABEL) {
                  if (voxelGridId) send({ type: "removeItem", id: voxelGridId });
                  voxelGridId = msg.id;
                } else if (msg.label === POSE_CUBES_LABEL) {
                  poseCubesId = msg.id;
                } else if (msg.livePose) {
                  if (previews.has(msg.label)) send({ type: "removeItem", id: previews.get(msg.label) });
                  previews.set(msg.label, msg.id);
                  placed.set(msg.livePose, msg.id);
                } else if (msg.label === FINAL_OBJECTS_LABEL) {
                  for (const id of previews.values()) send({ type: "removeItem", id });
                  previews.clear();
                  placed.clear();
                }
                send(msg);
                if (msg.id === voxelGridId && hideVoxelGrid) {
                  send({ type: "setItemVisible", id: msg.id, visible: false });
                }
              }
              finished = !!data.done;
              if (data.livePoses && !posesUrl) {
                posesUrl = data.livePoses;
                pollPoses();
              }
            }
          } catch (e) { /* not written yet, or the server hiccuped: retry */ }
          if (!finished) setTimeout(poll, POLL_MS);
        }

        // Each object's placement while its pose is optimised (the run's live_poses file):
        // its nodes in the voxel-grid and pose-cubes items and its preview-splats item go
        // there, so all of them move with the object. Sent every pass: an unchanged matrix
        // costs nothing, and an item still loading catches up on the next pass.
        async function pollPoses() {
          try {
            const res = await fetch(posesUrl + "?t=" + Date.now(), { cache: "no-store" });
            if (res.ok && (voxelGridId || poseCubesId || placed.size)) {
              const data = await res.json();
              for (const [node, matrix] of Object.entries(data.objects || {})) {
                for (const id of [voxelGridId, poseCubesId]) {
                  if (id) send({ type: "setTransform", id, node, matrix });
                }
                if (placed.has(node)) send({ type: "setTransform", id: placed.get(node), matrix });
              }
            }
          } catch (e) { /* not written yet: retry */ }
          if (!finished) setTimeout(pollPoses, POSES_MS);
        }

        const bundle = q.get("bundle");
        if (!bundle) { fail("No `bundle` parameter — viewer bundle URL missing."); return; }
        const script = document.createElement("script");
        script.src = bundle;
        script.onerror = () => fail(
          "Could not load the viewer bundle. Build submodules/3DView (see install.sh) " +
          "or point DEMO_VIEWER_DIST at a dist/ containing webview.js."
        );
        // The bundle listens from the end of its script on (it posts `ready` then), so the
        // first sources can be posted as soon as it has run.
        script.onload = () => poll();
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
